  <?
    // 是否鎖定下面這 4 個 CDN 套件(easymde/marked/dompurify/highlight.js)的
    // 版本號,並用 integrity 屬性做 SRI 完整性驗證。
    //
    // true(預設,建議平常保持這樣):瀏覽器下載這幾個檔案時,會用下面寫死的
    // hash 核對內容有沒有被竄改,一個位元組對不上就直接拒絕載入、整個檔案
    // 不會執行——不管是 jsdelivr 被 MITM,還是這幾個套件的發布權限被盜、
    // 惡意版本被發布出來,都不會被默默套用到每個訪客身上(包含你自己輸入
    // 寫入密碼的當下)。
    //
    // false:改回抓 jsdelivr 上的最新版,不驗證雜湊(不驗證是必要的——雜湊
    // 是對應「這個版本」算出來的,版本一直變的話,固定雜湊只會讓瀏覽器一直
    // 擋下正常的新版本,等於整個網站打不開)。想檢查/升級版本時的流程:
    //   1. 把這裡改成 false,儲存、重新整理頁面確認新版本沒有把
    //      EasyMDE/marked/DOMPurify/highlight.js 用壞(附件預覽、程式碼
    //      高亮、文章編輯器都测一下)。
    //   2. 確認沒問題後,把下面 6 個 URL 裡的版本號改成新版本,並重新算
    //      對應的 integrity(例如 `openssl dgst -sha384 -binary 檔案 |
    //      openssl base64 -A`,前面加上 "sha384-";或用
    //      https://www.srihash.org/ 貼網址直接產生)。
    //   3. 把這裡改回 true。
    // DOMPurify 是這個專案唯一的 XSS 防線,建議比其他幾個套件更常回來檢查
    // 一次;其餘幾個是變動慢的成熟套件,不用太頻繁。
    var CDN_PIN_VERSIONS_ = true;
  ?>
