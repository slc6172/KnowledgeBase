<style>
  :root {
    --color-bg: #F6F4F0;
    --color-surface: #FFFFFF;
    --color-ink: #2A2926;
    --color-ink-muted: #7A766E;
    --color-primary: #4F6F60;
    --color-primary-hover: #435F52;
    --color-primary-soft: #E8EEEA;
    --color-accent: #BFA06A;
    --color-accent-soft: #F5EEE0;
    --color-accent-ink: #74582D;
    --color-border: #EAE6DD;
    --color-draft: #9C9890;
    --color-danger: #A3402F;
    --color-danger-soft: #F6E7E3;
    --color-on-primary: #FFFFFF;
    --color-on-accent: #FFFFFF;
    --color-on-danger: #FFFFFF;
    --font-display: 'Noto Serif TC', serif;
    --font-body: 'Noto Sans TC', 'Helvetica Neue', sans-serif;
    --font-mono: 'Noto Sans Mono', ui-monospace, 'SFMono-Regular', monospace;
    --radius: 8px;
    --radius-lg: 14px;
    --content-width: 880px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 0.6em;
  }

  a { color: var(--color-primary); }

  code, pre {
    font-family: var(--font-mono);
    font-size: 0.92em;
  }

  /* 頂部導覽列 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1.75rem;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar__brand {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--color-ink);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .topbar__brand:hover { color: var(--color-primary); }

  .topbar__nav {
    display: flex;
    gap: 0.6rem;
  }

  /* 漢堡選單觸發按鈕——桌面版型預設隱藏,只在 <768px 的窄螢幕媒體查詢裡顯示 */
  .topbar__nav-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    border: none;
    background: none;
    color: var(--color-ink);
    cursor: pointer;
  }
  .topbar__nav-toggle svg { width: 1.5rem; height: 1.5rem; }

  /* 導覽抽屜(窄螢幕漢堡選單展開後的內容,由左側滑入) */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42, 41, 38, 0.45);
    z-index: 150;
  }

  .nav-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(80vw, 300px);
    background: var(--color-surface);
    box-shadow: 4px 0 24px rgba(42, 41, 38, 0.18);
    z-index: 151;
    display: flex;
    flex-direction: column;
    padding: 1.5rem 0;
    overflow-y: auto;
  }

  .nav-drawer__item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 0.9rem 1.5rem;
    border: none;
    background: none;
    font: inherit;
    font-size: 1rem;
    color: var(--color-ink);
    cursor: pointer;
  }
  .nav-drawer__item:hover,
  .nav-drawer__item:active { background: var(--color-primary-soft); }

  /* ===== 響應式斷點慣例:桌面 >=768px 維持以上版型;<768px 為窄螢幕版型 =====
     後續票(文章列表篩選面板/批次工具列、文章詳情更多選單、編輯器表單堆疊、
     分類標籤管理列堆疊)一律沿用同一個 767px 斷點,不重新定義。 */
  @media (max-width: 767px) {
    .topbar__nav { display: none; }
    .topbar__nav-toggle { display: flex; }

    /* 篩選面板:窄螢幕下改成由畫面底部滑入的面板,預設收起,開啟時加上
       .is-open。狀態/分類/標籤篩選欄位本身的行為不變,只是換了容器。 */
    .filter-panel {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 151;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 70vh;
      overflow-y: auto;
      padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
      background: var(--color-surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow: 0 -8px 24px rgba(42, 41, 38, 0.18);
    }
    .filter-panel.is-open { display: flex; }

    .filter-trigger { display: inline-flex; }
    #btn-open-filter-panel { display: inline-flex; }

    /* 批次操作工具列:窄螢幕下貼在畫面最下方,方便單手操作 */
    .batch-toolbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 140;
      margin: 0;
      border-radius: 0;
      box-shadow: 0 -6px 20px rgba(42, 41, 38, 0.15);
    }

    /* 文章詳情頁「更多」選單:分享/刪除收進由下滑入的面板,重用跟篩選面板
       同一套模式;「編輯」不在這裡,維持常駐顯示。 */
    .detail-more-menu {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 151;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
      background: var(--color-surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow: 0 -8px 24px rgba(42, 41, 38, 0.18);
    }
    .detail-more-menu.is-open { display: flex; }
    .more-trigger { display: inline-flex; }
    #btn-detail-more { display: inline-flex; }

    /* 附件線上預覽:固定 520px 高度在窄螢幕上比例失衡,改用相對視窗高度的
       單位,桌面版型(見上方 .attachment-preview__frame 基礎規則)不受影響 */
    .attachment-preview__frame { height: 60vh; }

    /* 分類/標籤管理節點列:允許換行堆疊,不做額外收合選單或觸控優化
       (Q1 定案:這兩個管理頁是低頻操作,能用、允許直向堆疊即可) */
    .category-node__row { flex-wrap: wrap; }
    .tag-node__row { flex-wrap: wrap; }
  }

  /* 主內容區 */
  .content {
    max-width: var(--content-width);
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .view.hidden { display: none; }

  /* 通用的隱藏 class,給不屬於特定元件的元素用(如 editor-attachment-section) */
  .hidden { display: none !important; }

  .empty-state {
    color: var(--color-ink-muted);
    text-align: center;
    padding: 3rem 1rem;
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-lg);
  }

  .empty-state-panel {
    color: var(--color-ink-muted);
    text-align: center;
    padding: 4rem 1rem;
    max-width: 420px;
    margin: 3rem auto;
  }
  .empty-state-panel h2 {
    color: var(--color-ink);
    margin-bottom: 0.6rem;
  }
  .empty-state-panel p {
    margin-bottom: 1.5rem;
  }

  /* 按鈕 */
  button, .btn {
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 0.5rem 1.1rem;
    border-radius: var(--radius);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-ink);
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  button:hover, .btn:hover { border-color: var(--color-ink-muted); }

  button:disabled, .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-on-primary);
  }

  .btn-primary:hover { background: var(--color-primary-hover); }

  /* 輕量強調按鈕——給頻繁的操作性動作用(搜尋/新增分類/行內確認等),
     跟 .btn-primary 的實心填滿區隔開,只留給真正關鍵的少數動作 */
  .btn-tinted {
    background: var(--color-primary-soft);
    border-color: var(--color-primary-soft);
    color: var(--color-primary);
  }
  .btn-tinted:hover { border-color: var(--color-primary); }

  .btn-danger {
    color: var(--color-danger);
    border-color: var(--color-danger-soft);
  }
  .btn-danger:hover { border-color: var(--color-danger); }

  /* 表單元件 */
  input[type="text"],
  input[type="search"],
  input[type="url"],
  textarea,
  select {
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 0.55rem 0.8rem;
    border-radius: var(--radius);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-ink);
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }

  /* 狀態徽記(印章風格) */
  .seal {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 500;
  }

  .seal::before {
    content: '';
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    box-sizing: border-box;
    flex-shrink: 0;
  }

  .seal--published {
    color: var(--color-primary);
  }
  .seal--published::before {
    background: var(--color-primary);
  }

  .seal--draft {
    color: var(--color-ink-muted);
  }
  .seal--draft::before {
    background: transparent;
    border: 2px solid var(--color-draft);
  }

  /* 標籤——中性灰階,靠文字本身辨識,不再靠顏色分辨不同標籤 */
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--color-border);
    color: var(--color-ink-muted);
    margin-right: 4px;
  }

  /* 卡片(文章列表用) */
  .article-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    cursor: pointer;
  }
  .article-card:hover { border-color: var(--color-ink-muted); }

  .article-card__title {
    font-family: var(--font-display);
    font-size: 1.2rem;
    margin: 0 0 0.4em;
  }

  .article-card__meta {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-bottom: 0.5rem;
    font-size: 0.82rem;
    color: var(--color-ink-muted);
  }

  .article-card__snippet {
    color: var(--color-ink-muted);
    margin: 0 0 0.7rem;
  }

  .article-card__tags .tag {
    margin-bottom: 4px;
  }

  /* 「你可能也想看」——比列表卡片精簡,只有標題+分類,橫向排列。 */
  #detail-related-articles-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
  }
  .related-article-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 0.8rem 1rem;
    cursor: pointer;
    flex: 1 1 220px;
  }
  .related-article-card:hover { border-color: var(--color-ink-muted); }
  .related-article-card__title {
    font-family: var(--font-display);
    margin-bottom: 0.2em;
  }
  .related-article-card__category {
    font-size: 0.82rem;
    color: var(--color-ink-muted);
  }

  /* 搜尋列 */
  .search-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }
  #search-input { flex: 1; }
  .search-bar .tag-input {
    min-width: 160px;
  }

  /* 篩選面板容器——桌面版型用 display: contents 讓子元素(狀態/分類/標籤
     篩選)直接變成 .search-bar 的 flex item,版面跟改動前完全一樣;窄螢幕下
     的樣子在下面 767px 媒體查詢裡覆寫成由下滑入的面板。 */
  .filter-panel { display: contents; }

  .filter-trigger { display: none; align-items: center; gap: 0.35rem; }
  .filter-trigger svg { width: 1.05rem; height: 1.05rem; }

  /* 批次操作工具列 */
  .batch-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.8rem;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 0.7rem 1rem;
    margin-bottom: 1rem;
  }
  .batch-toolbar__count {
    font-size: 0.85rem;
    color: var(--color-ink-muted);
    margin-right: 0.4rem;
  }
  .batch-toolbar__group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .batch-toolbar__group--tags .tag-input {
    width: 200px;
  }
  .batch-toolbar__group--tags .tag-input__chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  /* RAG 問答的 AI 回答區塊——只有持有密碼快取的人才會看到。多輪對話疊加
     顯示,超過一個畫面高度時面板本身可以捲動,不會把整個頁面越撐越長。 */
  .ai-answer {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.3rem;
    margin-bottom: 1.2rem;
    max-height: 60vh;
    overflow-y: auto;
  }
  .ai-answer__turn + .ai-answer__turn {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--color-border);
  }
  .ai-answer__question {
    font-family: var(--font-display);
    color: var(--color-ink-muted);
    margin-bottom: 0.4em;
  }
  .ai-answer__text {
    white-space: pre-wrap;
    line-height: 1.6;
    margin-bottom: 0.8rem;
  }
  .ai-answer__sources {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .ai-answer__source {
    font-size: 0.82rem;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
  }

  /* 勾選模式下,文章卡片左上角的 checkbox——放大本體 + 加大可點擊 padding,
     原生預設大小在手機上太小、常常點不中。 */
  .article-card__select {
    display: inline-block;
    margin-bottom: 0.5rem;
    padding: 0.4rem;
  }
  .article-card__select input[type="checkbox"] {
    width: 22px;
    height: 22px;
    transform: scale(1.6);
    transform-origin: top left;
    cursor: pointer;
  }

  /* 文章列表分頁 */
  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .pager__label { color: var(--color-ink-muted); }

  /* 訊息 toast */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--color-ink);
    color: var(--color-bg);
    padding: 0.7rem 1.4rem;
    border-radius: var(--radius);
    font-size: 0.9rem;
    z-index: 100;
  }
  .toast.hidden { display: none; }
  .toast--error {
    background: var(--color-danger-soft);
    color: var(--color-danger);
    border: 1px solid var(--color-danger);
  }

  /* 密碼輸入 modal(寫入類操作的密碼守門員) */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42, 41, 38, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 12px 32px rgba(42, 41, 38, 0.22);
  }
  .modal__title {
    font-size: 1.05rem;
    margin: 0 0 0.5em;
  }
  .modal__hint {
    color: var(--color-ink-muted);
    font-size: 0.85rem;
    margin: 0 0 1.1rem;
  }
  .modal__input { width: 100%; margin-bottom: 1.1rem; }
  .modal__actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
  }

  /* 文章編輯表單 */
  .field { margin-bottom: 1.1rem; }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: var(--color-ink-muted);
    margin-bottom: 0.3rem;
  }
  .field input[type="text"],
  .field select {
    width: 100%;
  }

  .editor-actions {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.5rem;
  }

  /* 標籤輸入(chips + 自動建議) */
  .tag-input {
    position: relative;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 0.5rem 0.7rem;
    background: var(--color-surface);
  }
  .tag-input__chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .tag--removable {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tag__remove {
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    font-size: 0.95em;
    color: inherit;
    line-height: 1;
  }
  .tag-input__field {
    border: none;
    padding: 0.3rem 0;
    width: 100%;
  }
  .tag-input__field:focus { box-shadow: none; }
  .tag-input__browse-toggle {
    border: none;
    background: none;
    padding: 0.3rem 0;
    color: var(--color-ink-muted);
    font-size: 0.82rem;
    cursor: pointer;
  }
  .tag-input__browse-toggle:hover { color: var(--color-ink); }
  .tag-input__browse-list {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    margin-top: 4px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 4px 14px rgba(42, 41, 38, 0.08);
  }
  .tag-input__browse-list.hidden { display: none; }
  .tag-input__browse-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.3rem 0.2rem;
    font-size: 0.88rem;
    cursor: pointer;
    border-radius: var(--radius);
  }
  .tag-input__browse-item:hover { background: var(--color-primary-soft); }
  .tag-input__browse-item--selected { font-weight: 600; }
  .tag-input__suggestions {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    margin-top: 4px;
    max-height: 180px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 4px 14px rgba(42, 41, 38, 0.08);
  }
  .tag-input__suggestions.hidden { display: none; }
  .tag-input__suggestion {
    padding: 0.45rem 0.7rem;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .tag-input__suggestion:hover { background: var(--color-primary-soft); }

  /* EasyMDE 微調,貼近 F6 字體/邊框調性 */
  .CodeMirror {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    border-color: var(--color-border);
  }
  .editor-toolbar { border-color: var(--color-border); }

  /* 文章詳情 */
  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }
  .detail-header__meta {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    font-size: 0.85rem;
    color: var(--color-ink-muted);
  }
  .detail-header__actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  /* 桌面版型用 flex order 固定「分享/編輯/刪除」的視覺順序,跟改動前一致;
     這樣窄螢幕版型可以自由把分享/刪除挪進 .detail-more-menu 這個新容器,
     不影響桌面順序。 */
  #btn-share-article { order: 1; }
  #btn-edit-article { order: 2; }
  #btn-delete-article { order: 3; }
